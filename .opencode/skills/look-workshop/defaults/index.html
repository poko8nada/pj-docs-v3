<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundation</title>
  </head>
  <body class="min-h-screen bg-background text-foreground flex flex-col">
    <!--
    共通スケルトン: header / main / footer のみ。
    各要素に data-aid="<id>" を振るとコメントと紐づく。
    FAB・ドロワー・補助線は annotate.js が body に生成する（dev のみ）。HTML には載せない。
  -->
    <header
      data-aid="header"
      class="flex items-center justify-between px-6 py-4 border-b border-border bg-background"
    >
      <span class="font-semibold tracking-tight" data-aid="brand">Brand</span>
      <nav class="flex gap-4 text-sm text-muted-foreground" data-aid="nav" aria-label="Main">
        <a href="#" data-aid="nav-top">Top</a>
        <a href="#" data-aid="nav-about">About</a>
        <a href="#" data-aid="nav-contact">Contact</a>
      </nav>
    </header>

    <main class="flex-1 p-8 space-y-6 max-w-3xl mx-auto w-full" data-aid="main">
      <h1 class="text-2xl font-semibold" data-aid="title">Foundation</h1>
      <p class="text-muted-foreground" data-aid="intro">
        共通スケルトン（header / main / footer）。トークンは look.css
        に集約し、要素をクリックしてコメントを付けるとエージェントと話し合える。
        要素をホバーすると補助線と aid が表示される（dev tool風）。
      </p>
    </main>

    <footer
      data-aid="footer"
      class="px-6 py-4 border-t border-border text-xs text-muted-foreground bg-background"
    >
      <span data-aid="copyright">© 2026 Brand. All rights reserved.</span>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
